services:
  api:
    build:
      context: .
      dockerfile: Containerfile.linuxone
    ports:
      - "8000:8000"
    environment:
      CITYSHIELD_CONFIG: /opt/app-root/src/config/city.example.json
    volumes:
      - cityshield-runtime:/opt/app-root/src/backend/data/runtime

volumes:
  cityshield-runtime:


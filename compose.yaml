services:
  api:
    build:
      context: .
      dockerfile: Containerfile.linuxone
    ports:
      - "8000:8000"
    environment:
      CITYSHIELD_CONFIG: /opt/app-root/src/config/city.example.json
    volumes:
      - cityshield-runtime:/opt/app-root/src/backend/data/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  cityshield-runtime:

